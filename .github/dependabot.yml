# Dependabot: opens a pull request each week when a package has an update
# or a security fix. Nothing changes until you review and merge it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
